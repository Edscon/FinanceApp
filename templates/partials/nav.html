{% with on='bg-slate-800 text-white' off='text-slate-400 hover:bg-slate-800/60 hover:text-white' %}
<div class="{% if compact %}flex gap-1{% else %}space-y-1{% endif %}">
  <a href="{% url 'core:dashboard' %}" class="block whitespace-nowrap rounded-lg px-3 py-2 text-sm {% if section == 'panel' %}{{ on }}{% else %}{{ off }}{% endif %}">Panel</a>
  <a href="{% url 'market:data' %}" class="block whitespace-nowrap rounded-lg px-3 py-2 text-sm {% if section == 'datos' %}{{ on }}{% else %}{{ off }}{% endif %}">Datos</a>

  <a href="{% url 'core:jobs' %}" class="block whitespace-nowrap rounded-lg px-3 py-2 text-sm {% if section == 'trabajos' %}{{ on }}{% else %}{{ off }}{% endif %}">Trabajos</a>
